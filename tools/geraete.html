<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Geräte-Bild für den Hero (wird gerendert, nicht veröffentlicht)</title>
<!--
  Vorlage für assets/screens/geraete-*.webp: Rechner mit der Startseite, iPad mit der Kasse, iPhone mit der Inventur.
  Fläche 2000 × 1440, transparenter Hintergrund (wie das Geräte-Bild auf presio.eu).
  Rendern: node tools/render-geraete.cjs http://127.0.0.1:9370  (Vorschau aus dem Website-Ordner)
-->
<style>
  html, body { margin: 0; background: transparent; }
  .flaeche { position: relative; width: 2000px; height: 1440px; font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }

  /* Rechner (Bildschirm mit schmalem Rand, Fuß darunter) */
  .rechner { position: absolute; left: 540px; top: 24px; width: 1420px; }
  .rechner .rahmen { background: #1b1d22; border-radius: 30px; padding: 18px; box-shadow: 0 60px 120px -30px rgba(6, 18, 52, 0.55), 0 0 0 2px #2c2f36 inset; }
  .rechner .fenster { border-radius: 12px; overflow: hidden; background: #fff; }
  .rechner .kopf { height: 48px; background: #eef1f4; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid #dfe4ea; }
  .rechner .kopf i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .rechner .kopf i:nth-child(1) { background: #ff5f57; } .rechner .kopf i:nth-child(2) { background: #febc2e; } .rechner .kopf i:nth-child(3) { background: #28c840; }
  .rechner .adresse { margin: 0 auto; width: 420px; height: 28px; border-radius: 8px; background: #fff; color: #425466; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 7px; transform: translateX(-30px); }
  .rechner .adresse svg { width: 12px; height: 12px; }
  .rechner img { display: block; width: 100%; height: auto; }
  .rechner .hals { width: 230px; height: 150px; margin: 0 auto; background: linear-gradient(90deg, #9aa2ad, #e3e7ec 45%, #c3c9d1 70%, #8e96a1);
    clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); }
  .rechner .fuss { width: 520px; height: 22px; margin: 0 auto; border-radius: 4px 4px 14px 14px; background: linear-gradient(180deg, #e7ebef, #b9c0c9); box-shadow: 0 18px 30px -12px rgba(6, 18, 52, 0.45); }

  /* iPad quer */
  .ipad { position: absolute; left: 70px; top: 700px; width: 940px; background: #111317; border-radius: 46px; padding: 26px;
    box-shadow: 0 50px 100px -24px rgba(6, 18, 52, 0.6), 0 0 0 2px #2a2d33 inset; }
  .ipad .schirm { border-radius: 20px; overflow: hidden; background: #fff; }
  .ipad img { display: block; width: 100%; height: auto; }

  /* iPhone */
  .iphone { position: absolute; left: 1596px; top: 470px; width: 372px; background: #111317; border-radius: 66px; padding: 15px;
    box-shadow: 0 50px 100px -24px rgba(6, 18, 52, 0.6), 0 0 0 2px #2a2d33 inset; }
  .iphone .schirm { position: relative; border-radius: 52px; overflow: hidden; background: #fff; }
  .iphone .insel { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 112px; height: 33px; border-radius: 20px; background: #000; z-index: 2; }
  .iphone .status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-size: 17px; font-weight: 600; color: #0A2540; }
  .iphone .status svg { height: 13px; }
  .iphone img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="flaeche" id="flaeche">
  <div class="rechner">
    <div class="rahmen">
      <div class="fenster">
        <div class="kopf"><i></i><i></i><i></i>
          <span class="adresse"><svg viewBox="0 0 12 12" fill="none" stroke="#697386" stroke-width="1.4"><rect x="2" y="5.5" width="8" height="5.5" rx="1.2"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5"/></svg>erp.ordaneo.de</span>
        </div>
        <img src="../assets/screens/uebersicht-hell-2400.webp" alt="">
      </div>
    </div>
    <div class="hals"></div>
    <div class="fuss"></div>
  </div>
  <div class="ipad"><div class="schirm"><img src="../assets/screens/kasse-hell-2360.webp" alt=""></div></div>
  <div class="iphone"><div class="schirm"><span class="insel"></span><div class="status"><span>17:35</span><svg viewBox="0 0 64 13" fill="#0A2540"><rect x="0" y="8" width="3.4" height="5" rx="1"/><rect x="5" y="5.5" width="3.4" height="7.5" rx="1"/><rect x="10" y="3" width="3.4" height="10" rx="1"/><rect x="15" y="0.5" width="3.4" height="12.5" rx="1"/><path d="M30 3.6a9.6 9.6 0 0 1 12.4 0l-1.5 1.6a7.4 7.4 0 0 0-9.4 0zM32.6 6.4a5.8 5.8 0 0 1 7.2 0l-1.5 1.6a3.6 3.6 0 0 0-4.2 0zM36.2 9.4l1.6 1.7-1.6 1.6-1.6-1.6z"/><rect x="46" y="1.5" width="15.5" height="10" rx="3" fill="none" stroke="#0A2540" stroke-width="1.2" opacity=".5"/><rect x="47.6" y="3.1" width="10.5" height="6.8" rx="1.8"/><rect x="62.4" y="4.6" width="1.6" height="3.8" rx=".8" opacity=".5"/></svg></div><img src="../assets/screens/app-hell-846.webp" alt=""></div></div>
</div>
</body>
</html>
